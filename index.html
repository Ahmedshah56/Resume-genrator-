<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Resume Builder | Create Your Perfect Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ============================================
       RESET & BASE STYLES
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Color System */
      --primary-purple: #667eea;
      --primary-pink: #764ba2;
      --accent-blue: #4facfe;
      --accent-cyan: #00f2fe;
      
      /* Neutrals */
      --neutral-900: #1a1a2e;
      --neutral-800: #2d3748;
      --neutral-700: #4a5568;
      --neutral-600: #718096;
      --neutral-500: #a0aec0;
      --neutral-400: #cbd5e0;
      --neutral-300: #e2e8f0;
      --neutral-200: #edf2f7;
      --neutral-100: #f7fafc;
      --white: #ffffff;
      
      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.2);
      --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.3);
      
      /* Spacing */
      --spacing-xs: 0.5rem;
      --spacing-sm: 1rem;
      --spacing-md: 1.5rem;
      --spacing-lg: 2rem;
      --spacing-xl: 3rem;
      
      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      
      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
      
       background: url("./Office.jpg") no-repeat center center/cover;
    }

    /* Animated Background Effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(79, 172, 254, 0.2) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: backgroundShift 20s ease infinite;
    }

    @keyframes backgroundShift {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* ============================================
       HEADER SECTION
       ============================================ */
    .page-header {
      text-align: center;
      padding: clamp(2rem, 5vw, 3.5rem) 1.25rem clamp(1.5rem, 4vw, 2.5rem);
      position: relative;
      z-index: 10;
      animation: fadeInDown 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.75rem);
      font-weight: 900;
      color: var(--white);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .page-header p {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: rgba(255, 255, 255, 0.95);
      font-weight: 300;
      letter-spacing: 0.025em;
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s backwards;
    }

    /* ============================================
       CONTAINER & LAYOUT
       ============================================ */
    .main-wrapper {
      position: relative;
      z-index: 1;
      padding: 0 1.25rem clamp(2rem, 5vw, 4rem);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
      gap: clamp(1.25rem, 3vw, 2rem);
      align-items: start;
    }

    /* ============================================
       FORM SECTION
       ============================================ */
    .form-section {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: clamp(1.75rem, 4vw, 2.5rem);
      box-shadow: var(--shadow-xl);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: slideInLeft 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      will-change: transform;
    }

    .form-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-purple), var(--primary-pink));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }

    .form-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      color: var(--neutral-800);
      margin-bottom: clamp(1.5rem, 3vw, 2rem);
      position: relative;
      padding-bottom: 1rem;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    .form-section h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-purple), var(--primary-pink));
      border-radius: 2px;
    }

    /* Form Groups */
    .form-group {
      margin-bottom: clamp(1.25rem, 2.5vw, 1.75rem);
      animation: fadeIn 0.6s ease backwards;
    }

    .form-group:nth-child(1) { animation-delay: 0.05s; }
    .form-group:nth-child(2) { animation-delay: 0.1s; }
    .form-group:nth-child(3) { animation-delay: 0.15s; }
    .form-group:nth-child(4) { animation-delay: 0.2s; }
    .form-group:nth-child(5) { animation-delay: 0.25s; }
    .form-group:nth-child(6) { animation-delay: 0.3s; }
    .form-group:nth-child(7) { animation-delay: 0.35s; }
    .form-group:nth-child(8) { animation-delay: 0.4s; }
    .form-group:nth-child(9) { animation-delay: 0.45s; }

    .form-group label {
      display: block;
      font-weight: 600;
      color: var(--neutral-700);
      margin-bottom: 0.625rem;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color var(--transition-base);
    }

    /* Input Styles */
    .input-wrapper {
      position: relative;
      width: 100%;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.875rem 1.125rem;
      border: 2px solid var(--neutral-300);
      border-radius: var(--radius-md);
      font-size: clamp(0.9375rem, 2vw, 1rem);
      font-family: 'Inter', sans-serif;
      color: var(--neutral-800);
      background: var(--white);
      transition: all var(--transition-base);
      outline: none;
      line-height: 1.5;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--neutral-500);
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      max-height: 300px;
    }

    textarea[id="experience"],
    textarea[id="education"] {
      min-height: 120px;
    }

    /* Button Group */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.875rem;
      margin-top: clamp(1.5rem, 3vw, 2rem);
    }

    button {
      padding: 1rem 1.5rem;
      border: none;
      border-radius: var(--radius-md);
      font-size: clamp(0.9375rem, 2vw, 1rem);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.025em;
      text-transform: uppercase;
      box-shadow: var(--shadow-md);
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    button:active::before {
      width: 300px;
      height: 300px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-pink) 100%);
      color: var(--white);
      position: relative;
      z-index: 1;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--white);
      color: var(--primary-purple);
      border: 2px solid var(--primary-purple);
    }

    .btn-secondary:hover {
      background: var(--primary-purple);
      color: var(--white);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary:active {
      transform: translateY(-1px);
    }

    /* ============================================
       RESUME PREVIEW SECTION
       ============================================ */
    .resume-preview {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: clamp(2rem, 5vw, 3rem);
      box-shadow: var(--shadow-xl);
      animation: slideInRight 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      will-change: transform;
    }

    /* Resume Header */
    .resume-header {
      text-align: center;
      padding-bottom: clamp(1.5rem, 3vw, 2rem);
      border-bottom: 3px solid var(--primary-purple);
      margin-bottom: clamp(1.5rem, 3vw, 2rem);
      position: relative;
    }

    .resume-header::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-purple), var(--primary-pink));
      border-radius: 2px;
    }

    .resume-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      color: var(--neutral-800);
      margin-bottom: 0.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.2;
      word-wrap: break-word;
    }

    .resume-header .job-title {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: var(--primary-purple);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    /* Contact Info */
    .contact-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(0.75rem, 2vw, 1.25rem);
      margin-top: 1.25rem;
      font-size: clamp(0.875rem, 2vw, 0.9375rem);
      color: var(--neutral-700);
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      padding: 0.375rem 0.75rem;
      background: var(--neutral-100);
      border-radius: var(--radius-sm);
      transition: all var(--transition-base);
    }

    .contact-item:hover {
      background: var(--neutral-200);
      transform: translateY(-2px);
    }

    .contact-item span:first-child {
      font-size: 1.125rem;
    }

    /* Resume Sections */
    .section {
      margin-bottom: clamp(1.5rem, 3vw, 2rem);
      animation: fadeIn 0.6s ease;
    }

    .section h3 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.25rem, 3vw, 1.5rem);
      color: var(--neutral-800);
      margin-bottom: 1rem;
      padding-bottom: 0.625rem;
      border-bottom: 2px solid var(--neutral-300);
      position: relative;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .section h3::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-purple), var(--primary-pink));
    }

    .section-content {
      color: var(--neutral-700);
      line-height: 1.8;
      font-size: clamp(0.9375rem, 2vw, 1rem);
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .section-content:empty::before {
      content: 'Your content will appear here...';
      color: var(--neutral-500);
      font-style: italic;
    }

    /* Skills Display */
    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
    }

    .skill-tag {
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-pink) 100%);
      color: var(--white);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: clamp(0.8125rem, 2vw, 0.875rem);
      font-weight: 500;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-base);
      white-space: nowrap;
    }

    .skill-tag:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    /* ============================================
       ANIMATIONS
       ============================================ */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ============================================
       PRINT STYLES
       ============================================ */
    @media print {
      body {
        background: var(--white);
      }
      
      body::before,
      .page-header,
      .form-section {
        display: none !important;
      }
      
      .main-wrapper {
        padding: 0;
      }
      
      .container {
        grid-template-columns: 1fr;
        gap: 0;
      }
      
      .resume-preview {
        box-shadow: none;
        padding: 1.25rem;
        border-radius: 0;
      }
      
      .skill-tag {
        break-inside: avoid;
      }
      
      .section {
        break-inside: avoid;
      }
    }

    /* ============================================
       RESPONSIVE DESIGN
       ============================================ */
    
    /* Large Desktops */
    @media (min-width: 1440px) {
      .container {
        grid-template-columns: 580px 1fr;
      }
      
      .form-section {
        position: sticky;
        top: 1.25rem;
        max-height: calc(100vh - 2.5rem);
        overflow-y: auto;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) and (max-width: 1439px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
      
      .form-section {
        position: sticky;
        top: 1.25rem;
        max-height: calc(100vh - 2.5rem);
        overflow-y: auto;
      }
    }

    /* Tablet */
    @media (max-width: 1023px) {
      .container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .form-section,
      .resume-preview {
        animation: fadeIn 0.8s ease;
      }
    }

    /* Mobile */
    @media (max-width: 640px) {
      .page-header {
        padding: 2rem 1rem 1.5rem;
      }
      
      .main-wrapper {
        padding: 0 1rem 2rem;
      }
      
      .form-section,
      .resume-preview {
        padding: 1.5rem;
        border-radius: var(--radius-lg);
      }
      
      .btn-group {
        grid-template-columns: 1fr;
      }
      
      .contact-info {
        flex-direction: column;
        align-items: center;
        gap: 0.625rem;
      }
      
      .contact-item {
        width: 100%;
        justify-content: center;
      }
    }

    /* Custom Scrollbar */
    .form-section::-webkit-scrollbar,
    .resume-preview::-webkit-scrollbar {
      width: 8px;
    }

    .form-section::-webkit-scrollbar-track,
    .resume-preview::-webkit-scrollbar-track {
      background: var(--neutral-200);
      border-radius: 4px;
    }

    .form-section::-webkit-scrollbar-thumb,
    .resume-preview::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
      border-radius: 4px;
    }

    .form-section::-webkit-scrollbar-thumb:hover,
    .resume-preview::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
    }

    /* Focus Visible for Accessibility */
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--primary-purple);
      outline-offset: 2px;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Page Header -->
  <header class="page-header">
    <h1>Resume Builder</h1>
    <p>Create a professional resume in minutes</p>
  </header>

  <!-- Main Wrapper -->
  <div class="main-wrapper">
    <div class="container">
      
      <!-- Form Section -->
      <section class="form-section" role="form" aria-label="Resume form">
        <h2>Your Details</h2>
        
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="fullName" 
              placeholder="Ahmed Shah"
              aria-label="Enter your full name"
              autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="jobTitle">Job Title</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="jobTitle" 
              placeholder="Software Engineer"
              aria-label="Enter your job title"
              autocomplete="organization-title">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              placeholder="ahmed.shah@email.com"
              aria-label="Enter your email address"
              autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="input-wrapper">
            <input 
              type="tel" 
              id="phone" 
              placeholder="+92 (325) 123-4567"
              aria-label="Enter your phone number"
              autocomplete="tel">
          </div>
        </div>

        <div class="form-group">
          <label for="address">Location</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="address" 
              placeholder="Sukkur, Sindh"
              aria-label="Enter your location"
              autocomplete="address-level2">
          </div>
        </div>

        <div class="form-group">
          <label for="summary">Professional Summary</label>
          <div class="input-wrapper">
            <textarea 
              id="summary" 
              placeholder="A brief overview of your professional background and key achievements..."
              aria-label="Enter your professional summary"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="skills">Skills (comma separated)</label>
          <div class="input-wrapper">
            <textarea 
              id="skills" 
              placeholder="JavaScript, React, Node.js, Python, AWS"
              aria-label="Enter your skills separated by commas"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="experience">Work Experience</label>
          <div class="input-wrapper">
            <textarea 
              id="experience" 
              placeholder="Describe your work experience, positions held, and key responsibilities..."
              aria-label="Enter your work experience"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="education">Education</label>
          <div class="input-wrapper">
            <textarea 
              id="education" 
              placeholder="List your educational background, degrees, and certifications..."
              aria-label="Enter your education background"></textarea>
          </div>
        </div>

        <div class="btn-group">
          <button 
            class="btn-primary" 
            onclick="window.print()"
            aria-label="Download resume as PDF">
            📥 Download PDF
          </button>
          <button 
            class="btn-secondary" 
            onclick="clearForm()"
            aria-label="Clear all form fields">
            🔄 Clear All
          </button>
        </div>
      </section>

      <!-- Resume Preview Section -->
      <section class="resume-preview" role="region" aria-label="Resume preview">
        
        <header class="resume-header">
          <h1 id="displayName">Your Name</h1>
          <div class="job-title" id="displayTitle">Your Job Title</div>
          
          <div class="contact-info">
            <div class="contact-item">
              <span aria-hidden="true">✉️</span>
              <span id="displayEmail">email@example.com</span>
            </div>
            <div class="contact-item">
              <span aria-hidden="true">📞</span>
              <span id="displayPhone">+1 (555) 123-4567</span>
            </div>
            <div class="contact-item">
              <span aria-hidden="true">📍</span>
              <span id="displayAddress">City, State</span>
            </div>
          </div>
        </header>

        <article class="section">
          <h3>Professional Summary</h3>
          <div class="section-content" id="displaySummary"></div>
        </article>

        <article class="section">
          <h3>Skills</h3>
          <div class="skills-list" id="displaySkills"></div>
        </article>

        <article class="section">
          <h3>Work Experience</h3>
          <div class="section-content" id="displayExperience"></div>
        </article>

        <article class="section">
          <h3>Education</h3>
          <div class="section-content" id="displayEducation"></div>
        </article>

      </section>

    </div>
  </div>

  <script>
    /**
     * Resume Builder Application
     * Real-time resume preview with form validation
     */
    
    // Cache DOM elements for performance
    const elements = {
      inputs: {
        fullName: document.getElementById('fullName'),
        jobTitle: document.getElementById('jobTitle'),
        email: document.getElementById('email'),
        phone: document.getElementById('phone'),
        address: document.getElementById('address'),
        summary: document.getElementById('summary'),
        skills: document.getElementById('skills'),
        experience: document.getElementById('experience'),
        education: document.getElementById('education')
      },
      displays: {
        name: document.getElementById('displayName'),
        title: document.getElementById('displayTitle'),
        email: document.getElementById('displayEmail'),
        phone: document.getElementById('displayPhone'),
        address: document.getElementById('displayAddress'),
        summary: document.getElementById('displaySummary'),
        skills: document.getElementById('displaySkills'),
        experience: document.getElementById('displayExperience'),
        education: document.getElementById('displayEducation')
      }
    };

    /**
     * Update resume preview with current form values
     */
    function updateResume() {
      // Personal Information
      const name = elements.inputs.fullName.value.trim() || 'Your Name';
      const title = elements.inputs.jobTitle.value.trim() || 'Your Job Title';
      const email = elements.inputs.email.value.trim() || 'email@example.com';
      const phone = elements.inputs.phone.value.trim() || '+1 (555) 123-4567';
      const address = elements.inputs.address.value.trim() || 'City, State';
      
      elements.displays.name.textContent = name;
      elements.displays.title.textContent = title;
      elements.displays.email.textContent = email;
      elements.displays.phone.textContent = phone;
      elements.displays.address.textContent = address;

      // Professional Summary
      const summary = elements.inputs.summary.value.trim();
      elements.displays.summary.textContent = summary;

      // Skills - Parse and display as tags
      updateSkills();

      // Work Experience
      const experience = elements.inputs.experience.value.trim();
      elements.displays.experience.textContent = experience;

      // Education
      const education = elements.inputs.education.value.trim();
      elements.displays.education.textContent = education;
    }

    /**
     * Parse skills input and create skill tags
     */
    function updateSkills() {
      const skillsText = elements.inputs.skills.value.trim();
      const skillsContainer = elements.displays.skills;
      
      // Clear existing skills
      skillsContainer.innerHTML = '';
      
      if (skillsText) {
        // Split by comma, trim whitespace, and filter empty strings
        const skillsArray = skillsText
          .split(',')
          .map(skill => skill.trim())
          .filter(skill => skill.length > 0);
        
        // Create skill tags
        skillsArray.forEach(skill => {
          const skillTag = document.createElement('span');
          skillTag.className = 'skill-tag';
          skillTag.textContent = skill;
          skillsContainer.appendChild(skillTag);
        });
      }
    }

    /**
     * Clear all form fields and reset preview
     */
    function clearForm() {
      if (confirm('Are you sure you want to clear all fields?')) {
        // Clear all inputs
        Object.values(elements.inputs).forEach(input => {
          input.value = '';
        });
        
        // Update preview
        updateResume();
        
        // Focus on first input
        elements.inputs.fullName.focus();
      }
    }

    /**
     * Debounce function to limit update frequency
     * Improves performance on rapid input
     */
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Create debounced update function
    const debouncedUpdate = debounce(updateResume, 150);

    /**
     * Initialize event listeners
     */
    function init() {
      // Add input event listeners to all form fields
      Object.values(elements.inputs).forEach(input => {
        input.addEventListener('input', debouncedUpdate);
      });

      // Add smooth focus animations
      Object.values(elements.inputs).forEach(input => {
        input.addEventListener('focus', function() {
          this.parentElement.style.transform = 'scale(1.01)';
          this.parentElement.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        });
        
        input.addEventListener('blur', function() {
          this.parentElement.style.transform = 'scale(1)';
        });
      });

      // Initialize preview with default values
      updateResume();
      
      console.log('Resume Builder initialized successfully! 🚀');
    }

    // Initialize when DOM is fully loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // Handle print event
    window.addEventListener('beforeprint', () => {
      console.log('Printing resume...');
    });

    // Auto-save to localStorage (optional enhancement)
    function saveToLocalStorage() {
      const formData = {};
      Object.entries(elements.inputs).forEach(([key, input]) => {
        formData[key] = input.value;
      });
      localStorage.setItem('resumeData', JSON.stringify(formData));
    }

    // Load from localStorage on page load
    function loadFromLocalStorage() {
      const saved = localStorage.getItem('resumeData');
      if (saved) {
        try {
          const formData = JSON.parse(saved);
          Object.entries(formData).forEach(([key, value]) => {
            if (elements.inputs[key]) {
              elements.inputs[key].value = value;
            }
          });
          updateResume();
        } catch (e) {
          console.error('Error loading saved data:', e);
        }
      }
    }

    // Uncomment to enable auto-save feature
    // setInterval(saveToLocalStorage, 5000);
    // loadFromLocalStorage();
  </script>

</body>
</html>
